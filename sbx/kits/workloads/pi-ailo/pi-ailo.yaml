# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: workload
displayName: Pi Ailo
description: >-
  Pi, configured to use a self-hosted OpenAI-compatible model server.
sourceUrl: https://github.com/domtriola/dotfiles

# pi-ailo.dockerfile builds on Docker's pi image, pinned by version tag and
# digest. It takes the image (pi and its entrypoint) and not the descriptor of
# the upstream pi kit, so this kit does not get that kit's hosted-provider
# credential or its network allows. It states its own below.

# modelHost is required rather than defaulted: the address of a private machine
# does not belong in a repository that can be published.
#
# Prefer a name to an address. The proxy matches its policy on the name it was
# given, so the allow list below is built from the same value.
#
# The args reach the container as environment variables, which the startup
# hook reads.
args:
  modelHost:
    required: true
    pattern: '^[A-Za-z0-9.-]+$'
    description: Model server host, as reached from inside the sandbox
    env: MODEL_HOST
  modelPort:
    default: "8080"
    pattern: '^[0-9]+$'
    description: Model server port
    env: MODEL_PORT
  modelIds:
    default: ""
    pattern: '^[A-Za-z0-9._:/,-]*$'
    description: >-
      Comma-separated model ids, first one the startup default. Empty asks the
      server for its own list, which is the usual case.
    env: MODEL_IDS

capabilities:
  # The workload runs on the Docker Sandboxes platform: sbx starts the agent,
  # as the user that the image config names. Every sbx workload declares it.
  - type: com.docker.sandbox/sbx@1

  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          # host:port is the narrowest form the proxy enforces.
          - "${{ kit.args.modelHost }}:${{ kit.args.modelPort }}"
          # pi fetches extensions, skills, prompt templates and themes on
          # startup.
          - registry.npmjs.org
          # gh and git over HTTPS. Each domain that the credential below
          # injects into must be here too.
          - github.com
          - api.github.com
          - uploads.github.com
          - objects.githubusercontent.com
          - raw.githubusercontent.com

  # The sandbox's `github` secret, which sbx-up stores with sbx-token. In v2
  # it reached every sandbox. In v3 the proxy injects it only for a kit that
  # declares it. The entry is the same as in my-claude.
  - type: com.docker.sandbox/credential@1
    optional: true
    description: GitHub token for gh and for git over HTTPS
    config:
      service: github
      phase: runtime
      apiKey:
        name: GH_TOKEN
        proxyManaged: true
        inject:
          - {domain: api.github.com, header: Authorization, format: "Bearer %s"}
          - {domain: uploads.github.com, header: Authorization, format: "Bearer %s"}
          - {domain: raw.githubusercontent.com, header: Authorization, format: "Bearer %s"}
          - {domain: github.com, header: Authorization, format: "%s", username: x-access-token}

  - type: com.docker.sandbox/git-identity@1
    description: Attribute commits to my git identity

  # The scripts come from pi-ailo.dockerfile.
  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        - command: "sh /usr/local/libexec/pi-ailo-kit/install.sh"
          user: "1000"
          env: [HTTP_PROXY, HTTPS_PROXY]
          description: >-
            Point npm at the sandbox proxy in ~/.npmrc, so pi's run-time npm
            use works in exec contexts that do not inherit the proxy
            environment
      startup:
        - command: ["sh", "/usr/local/libexec/pi-ailo-kit/startup.sh"]
          user: "1000"
          env: [MODEL_HOST, MODEL_PORT, MODEL_IDS]
          description: >-
            Write ~/.pi/agent/models.json for the model server, with each
            model's context window, and check that the server answers

  # pi reads skills from ~/.agents/skills. The agent-skills mixin puts its
  # skills there.
  - type: com.docker.sandbox/agent-skills@1
    optional: true
    config:
      path: /home/agent/.agents/skills

  # pi reads its global instructions from ~/.pi/agent/AGENTS.md.
  - type: com.docker.sandbox/agent-context@1
    config:
      directory: /home/agent/.pi/agent
      filename: AGENTS.md
      content: |
        # Local Pi Agent Instructions

        Every model call goes to a self-hosted model server, declared as the
        `local` provider in `~/.pi/agent/models.json`. The kit rewrites that file
        on each start, so edits to it do not survive a restart. Use `/model` to
        switch models for the session.

        A server that loads models on demand holds one at a time. The first request
        for a model can then take tens of seconds, and naming a different model can
        unload the one in memory to make room. Staying on one model is faster than
        switching per task.

        The last start, and whether the server answered, is in
        `~/.pi-ailo-kit.log`.

        ## Docker Compose
        When a project runs its tooling in Docker Compose, use
        `sbx-compose-run <service> <command...>`, not `docker compose run`.
        It prints only the command's output and exits with the command's exit
        code. After the run, it gives back to you the files that the root
        container wrote, if `git status` shows them. Files that git ignores stay
        owned by root. Add `--deps` when the command needs the service's
        dependencies, such as a database. See `sbx-compose-run --help`.
