schemaVersion: "2"
kind: mixin
name: claude-settings
displayName: Claude Project Settings
description: >-
  Overlays a project scoped Claude Code settings file onto the sandbox workspace.
  The file lands at <workspace>/.claude/settings.local.json, which outranks both the
  repository's own .claude/settings.json and the runtime managed user settings, so
  the kit wins wherever the three disagree.

requires:
  agent: claude
