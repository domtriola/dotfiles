schemaVersion: "2"
kind: mixin
name: my-claude
displayName: My Claude
description: >-
  Claude Code with my custom settings.

# sbx no longer has a built-in claude agent, and a kit cannot extend the
# published one, so this is a mixin on it. sbx-up runs it as `sbx run
# docker.io/sbx/claude-kit@<digest> --kit <this kit>`. The bare name claude
# resolves to the v3 kit docker.io/sbx/claude, which v2 mixins cannot go on.
requires:
  agent: claude

# A mixin's agentInstructions go to a kits-memory file that the agent reads
# only when it needs it. These instructions must apply in every session, so the
# kit puts them in files/home/.claude/CLAUDE.md, the user memory that Claude
# Code always loads.

environment:
  variables:
    # The published claude kit sets DISABLE_TELEMETRY=1. That also turns off
    # feature flags, so the flag that enables /remote-control never loads.
    # Mixin variables merge last-wins, so this value replaces the kit's.
    # Claude Code reads "0" as false.
    DISABLE_TELEMETRY: "0"

permissions:
  network:
    allow:
      # The gh release download below. github.com redirects it to
      # objects.githubusercontent.com.
      - github.com
      - objects.githubusercontent.com

setup:
  install:
    # ~/.claude/settings.json is a sandbox-reserved path: the runtime owns it
    # and a kit file placed there is discarded. A mixin cannot set the launch
    # command, so Claude Code's --settings flag is not available either. The
    # managed settings file is the one settings file left, and Claude Code
    # reads it on each start. Static files under files/home are in place
    # before install commands run.
    - command: install -D -m 0644 /home/agent/.config/my-claude/settings.json /etc/claude-code/managed-settings.json
      description: "Install the Claude Code settings as managed settings"
    # The image ships Ubuntu's gh package, which is frozen at an old version.
    # Install a pinned release from GitHub over it: /usr/local/bin comes before
    # /usr/bin on PATH. The checksum file comes from the same release, which is
    # safe because cli/cli releases are immutable. Renovate bumps the version
    # (see renovate.json at the repository root).
    - command: |
        set -eu
        # renovate: datasource=github-releases depName=cli/cli
        v=2.103.3
        tarball="gh_${v}_linux_$(dpkg --print-architecture).tar.gz"
        url="https://github.com/cli/cli/releases/download/v$v"
        cd "$(mktemp -d)"
        curl -fsSL -O "$url/$tarball" -O "$url/gh_${v}_checksums.txt"
        sha256sum --check --ignore-missing "gh_${v}_checksums.txt"
        tar -xzf "$tarball"
        install -m 0755 gh_*/bin/gh /usr/local/bin/gh
      description: "Install a current gh from its GitHub release"
