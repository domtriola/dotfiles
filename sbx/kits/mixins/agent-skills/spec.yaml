schemaVersion: "2"
kind: mixin
name: agent-skills
displayName: Agent Skills
description: >-
  Ships this repo's personal agent skills into the sandbox and exposes them
  to whichever coding agent is running.

setup:
  # Tracked skills are pre-linked as symlinks committed under files/home/, so
  # they exist the moment the sandbox's files land, before any startup hook
  # runs. That matters: this hook races the agent CLI's own startup, and on a
  # sandbox that also runs the (slower) dotfiles kit, the CLI was observed
  # reading its skills directory before this hook got a turn. Only
  # experimental skills, whose names aren't known until the sandbox boots,
  # still need to be linked here.
  startup:
    - command:
        - "sh"
        - "-c"
        - |
          set -eu

          AGENT_DIRS="$HOME/.claude/skills $HOME/.gemini/skills $HOME/.agents/skills"
          for agent_dir in $AGENT_DIRS; do
            mkdir -p "$agent_dir"
          done

          link_skill() {
            skill_dir="$1"
            name="$(basename "$skill_dir")"
            for agent_dir in $AGENT_DIRS; do
              ln -sfn "$skill_dir" "$agent_dir/$name"
            done
          }

          # Experimental skills: ~/skills/experimental/<name>/SKILL.md, with up
          # to two levels of grouping (e.g. experimental/<vendor>/<topic>/<name>).
          # A copy of a shipped skill here shadows the tracked one.
          if [ -d "$HOME/skills/experimental" ]; then
            find "$HOME/skills/experimental" -mindepth 2 -maxdepth 4 \
              -name SKILL.md -type f |
              while read -r skill_file; do
                link_skill "$(dirname "$skill_file")"
              done
          fi
      description: "Symlink ~/skills/experimental/<name> into each agent's skills dir"
      user: "1000"

agentInstructions:
  content: |
    Skills are installed at ~/skills/<name>/. Tracked skills are symlinked
    into ~/.claude/skills/, ~/.gemini/skills/ and ~/.agents/skills/ as part
    of the sandbox's files (present before any startup hook runs). Untracked,
    experimental skills live under ~/skills/experimental/ and are symlinked
    the same way by a startup hook, since their names aren't known until the
    sandbox boots; they shadow a tracked skill of the same name.
