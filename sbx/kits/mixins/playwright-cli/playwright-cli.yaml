# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: Playwright CLI
description: >-
  Installs playwright-cli and Chromium in the background after the sandbox
  starts.
sourceUrl: https://github.com/domtriola/dotfiles

# The install script comes from playwright-cli.dockerfile, at
# /usr/local/libexec/playwright-cli-kit/install. It writes only under $HOME.

capabilities:
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          # The Node release index and tarballs.
          - nodejs.org
          # npm install -g @playwright/cli
          - registry.npmjs.org
          # The Chromium download, and the mirror Playwright falls back to.
          - cdn.playwright.dev
          - playwright.download.prss.microsoft.com
          # apt, for Chromium's system packages. The workloads are Debian.
          - deb.debian.org

  - type: com.docker.sandbox/lifecycle@1
    config:
      startup:
        - command:
            - "sh"
            - "-c"
            - |
              set -eu

              # Two files under $HOME report what the install is doing,
              # because the engine does not stop a sandbox whose startup work
              # fails:
              #
              #   .playwright-cli-kit.log     everything the install printed
              #   .playwright-cli-kit.status  the current step, then ready | failed
              #
              # Both are reset before the hook returns, so a restart never
              # reports the previous start's result. The wrapper on PATH goes
              # too: the install replaces the Node it runs, and writes it again
              # at the end.
              log="$HOME/.playwright-cli-kit.log"
              : >"$log"
              echo "starting the playwright-cli kit" >"$HOME/.playwright-cli-kit.status"
              rm -f "$HOME/.local/bin/playwright-cli"

              # Without the script, nothing else would ever write failed, so
              # say so here.
              script=/usr/local/libexec/playwright-cli-kit/install
              if [ ! -f "$script" ]; then
                echo "playwright-cli kit: $script is missing" >"$log"
                echo failed >"$HOME/.playwright-cli-kit.status"
                exit 0
              fi

              # Renovate bumps this pin (see renovate.json at the repository
              # root), after a 7-day release age.
              # renovate: datasource=npm depName=@playwright/cli
              cli_version=0.1.23

              # The install takes a minute or two, and an engine may hold the agent
              # until every startup hook returns. So the hook starts it detached
              # (setsid, so it outlives the hook) and returns at once. The
              # script reads the workspace only for the Node version the
              # project asks for.
              PLAYWRIGHT_CLI_VERSION="$cli_version" setsid nohup sh "$script" \
                "${WORKSPACE_DIR:-$PWD}" >>"$log" 2>&1 </dev/null &
          user: "1000"
          env: [WORKSPACE_DIR]
          description: Start the Node, playwright-cli, and Chromium install in the background

  - type: com.docker.sandbox/agent-context@1
    config:
      contentFile: ./playwright-cli-context.md
