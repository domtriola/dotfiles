# Replace find window with fzf-based session selector
bind f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"

# kamaji's board of the backlogs across projects. When the board fails, the
# popup waits for Enter, so the error stays on screen until it is read.
bind B display-popup -E -w 90% -h 80% "kamaji board || { echo; echo 'Press Enter to close.'; read _; }"

# =====================================================================
# https://tmux.info/docs/configuration

# ============================================
# ESSENTIAL SETTINGS
# ============================================

# Fix Vim ESC delay
set -sg escape-time 0

# Increase scrollback buffer
set -g history-limit 50000

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Enable mouse support
set -g mouse on

# Enable focus events for vim autoread
set -g focus-events on

# Set terminal with proper colors
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# Aggressive resize for multi-client
setw -g aggressive-resize on

# ============================================
# KEY BINDINGS
# ============================================

# Change prefix to Ctrl+a (more ergonomic)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Better pane splitting (and keep current path)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vim-style pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# F12 turns this tmux's keys off or on, for a tmux inside it (nested tmux)
bind -T root F12 \
  set prefix None \; \
  set key-table off \; \
  if -F '#{pane_in_mode}' 'send-keys -X cancel' \; \
  refresh-client -S
bind -T off F12 \
  set -u prefix \; \
  set -u key-table \; \
  refresh-client -S

# ============================================
# APPEARANCE
# ============================================

# Status bar position
set -g status-position top

# Status bar colors
set -g status-style 'bg=#13161d fg=#8b949e'
set -g status-left-length 40
set -g status-right-length 50

# The accent color. While F12 has turned this tmux's keys off, it is muted, so
# that the bar of the tmux inside it (which now gets the keys) stands out.
set -g @accent '#{?#{==:#{client_key_table},off},#484f58,#00e68a}'

# Status bar content: OFF while F12 has turned the keys off, the hostname for
# a client over SSH, then the session
set -g status-left '#{?#{==:#{client_key_table},off},#[fg=#000000 bg=#d29922 bold] OFF #[default],}#{?#{@ssh},#[fg=#8b949e bold] #h #[fg=#30363d]│,}#[fg=#{E:@accent},bold] #S #[fg=#30363d]│ '
set -g status-right '#[fg=#30363d]│#[fg=#8b949e] %H:%M #[fg=#30363d]│#[fg=#8b949e] %d-%b-%y '

# Mark a session as over SSH when a client attaches to it. tmux copies
# SSH_CONNECTION from each client into the session environment.
set-hook -g client-attached {
  if-shell 'tmux show-environment -t #{q:session_id} SSH_CONNECTION | grep -q =' \
    { set @ssh 1 } { set -u @ssh }
}
set-hook -g session-created {
  if-shell 'tmux show-environment -t #{q:session_id} SSH_CONNECTION | grep -q =' \
    { set @ssh 1 } { set -u @ssh }
}

# Window status
setw -g window-status-format ' #I:#W '
setw -g window-status-current-format '#[fg=#{E:@accent},bold] #I:#W '

# Pane border colors
set -g pane-border-style 'fg=#30363d'
set -g pane-active-border-style 'fg=#00e68a'

# Message styling
set -g message-style 'bg=#00e68a fg=#000000 bold'

# ============================================
# COPY MODE
# ============================================

# Use vi keys
setw -g mode-keys vi

# A copy in tmux goes to the terminal's clipboard through OSC 52, also over
# SSH. A program in a pane cannot set or read the clipboard: a sandbox agent
# shows its output here.
set -s set-clipboard external
if-shell 'command -v pbcopy' 'set -s copy-command pbcopy'
if-shell 'command -v wl-copy' 'set -s copy-command wl-copy'

# Vi-style copy bindings
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel
